<!doctype html>
<html lang="hi-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b4a3a" />
    <!--head-->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Brand preloader: inline so it paints before any JS/CSS bundle. Hidden unless the script below opts in. -->
    <style>
      #preloader { display: none; }
      #preloader.on {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 2.4rem;
        background: radial-gradient(44rem 30rem at 50% 44%, #fffef8, transparent 70%), #fdfbef;
        transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s 0.55s;
        /* Failsafe: never block the page, even if the script below stalls. */
        animation: pl-failsafe 0.4s 5s forwards;
      }
      #preloader.pl-out { opacity: 0; visibility: hidden; }
      .pl-stage { position: relative; width: min(13rem, 56vw); aspect-ratio: 1; display: grid; place-items: center; transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1); }
      .pl-out .pl-stage { transform: scale(1.04); }
      .pl-ring { position: absolute; inset: -18%; width: 136%; height: 136%; overflow: visible; }
      .pl-ring circle { fill: none; }
      .pl-halo { stroke: rgb(184 137 43 / 0.28); stroke-width: 0.6; transform-origin: 60px 60px; animation: pl-halo 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .pl-halo + .pl-halo { animation-delay: 1.2s; }
      .pl-track { stroke: rgb(184 137 43 / 0.18); stroke-width: 1.2; }
      .pl-arc {
        stroke: #b8892b; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 22 78;
        transform-origin: 60px 60px; animation: pl-spin 1.4s linear infinite;
      }
      /* The original symbol, untouched: only its opacity and scale animate. */
      .pl-stage img { position: relative; width: 82%; height: auto; opacity: 0; transform: scale(0.86); transition: opacity 0.8s, transform 1s cubic-bezier(0.22, 1, 0.36, 1); }
      .pl-stage img.in { opacity: 1; transform: none; }
      .pl-tag {
        margin: 0; font: 600 0.7rem/1 system-ui, sans-serif; letter-spacing: 0.32em; color: #0b4a3a;
        animation: pl-fade 1s 0.35s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }
      @keyframes pl-halo { from { transform: scale(0.82); opacity: 1; } to { transform: scale(1.12); opacity: 0; } }
      @keyframes pl-spin { to { transform: rotate(360deg); } }
      @keyframes pl-fade { from { opacity: 0; transform: translateY(8px); } }
      @keyframes pl-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .pl-halo, .pl-arc, .pl-tag { animation: none; }
        .pl-stage img { transition: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <div class="pl-stage">
        <svg class="pl-ring" viewBox="0 0 120 120">
          <circle class="pl-halo" cx="60" cy="60" r="58" /><circle class="pl-halo" cx="60" cy="60" r="58" />
          <circle class="pl-track" cx="60" cy="60" r="50" /><circle class="pl-arc" cx="60" cy="60" r="50" pathLength="100" />
        </svg>
        <img data-src="/img/logo-symbol.webp" alt="" width="499" height="455" onload="this.classList.add('in')" onerror="this.remove()" />
      </div>
      <p class="pl-tag">YOUR BUSINESS. OUR PRIORITY.</p>
    </div>
    <script>
      // Shows the preloader once per session; hides it once the page and its fonts are ready, not on full window load
      // (images keep loading behind it). Min 0.9s so the logo can land, max 2.5s.
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        var seen = '1'
        try { seen = sessionStorage.getItem('bfa-preloaded'); sessionStorage.setItem('bfa-preloaded', '1') } catch (e) { /* storage blocked: skip */ }
        var p = document.getElementById('preloader')
        if (seen) return p.remove()
        d.classList.add('preloading')
        p.classList.add('on')
        var img = p.querySelector('img')
        img.src = img.getAttribute('data-src')
        var t0 = Date.now(), done = false
        var min = matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 900
        function finish() {
          if (done) return
          done = true
          setTimeout(function () {
            p.classList.add('pl-out')
            d.classList.remove('preloading')
            setTimeout(function () { p.remove() }, 700)
          }, Math.max(0, min - (Date.now() - t0)))
        }
        document.addEventListener('DOMContentLoaded', function () {
          document.fonts && document.fonts.ready ? document.fonts.ready.then(finish) : finish()
        })
        setTimeout(finish, 2500)
      })()
    </script>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
