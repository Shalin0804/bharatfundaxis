<!doctype html>
<html lang="hi-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1838" />
    <!--head-->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Brand preloader: inline so it paints before any JS/CSS bundle. Hidden unless the script below opts in. -->
    <style>
      #preloader { display: none; }
      #preloader.on {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(48rem 32rem at 50% 42%, rgb(39 71 199 / 0.32), transparent 70%), #0a1838;
        transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s 0.55s;
        /* Failsafe: never block the page, even if the script below stalls. */
        animation: pl-failsafe 0.4s 5s forwards;
      }
      #preloader.pl-out { opacity: 0; visibility: hidden; }
      #preloader::before {
        content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
        background: linear-gradient(transparent, rgb(201 162 76 / 0.55), transparent);
        transform-origin: top; animation: pl-axis 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .pl-stage { position: relative; width: min(15rem, 62vw); aspect-ratio: 1; transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1); }
      .pl-out .pl-stage { transform: scale(1.04); }
      .pl-ring { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); overflow: visible; }
      .pl-ring circle { fill: none; stroke-width: 1.5; }
      .pl-track { stroke: rgb(255 255 255 / 0.1); }
      .pl-arc {
        stroke: #c9a24c; stroke-linecap: round; stroke-dasharray: 22 78;
        transform-origin: 60px 60px; animation: pl-spin 1.4s linear infinite;
      }
      .pl-plate {
        position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #fffdf8, #f3ead3);
        box-shadow: 0 30px 80px -30px rgb(0 0 0 / 0.7), 0 0 60px -10px rgb(201 162 76 / 0.35);
        animation: pl-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .pl-plate img { width: 128%; max-width: none; height: auto; /* the artwork has wide transparent margins */ opacity: 0; transform: scale(0.92); transition: opacity 0.7s, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
      .pl-plate img.in { opacity: 1; transform: none; }
      @keyframes pl-in { from { opacity: 0; transform: scale(0.88); } }
      @keyframes pl-axis { from { transform: scaleY(0); } }
      @keyframes pl-spin { to { transform: rotate(360deg); } }
      @keyframes pl-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #preloader::before, .pl-plate, .pl-arc { animation: none; }
        .pl-plate img { transition: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <div class="pl-stage">
        <svg class="pl-ring" viewBox="0 0 120 120"><circle class="pl-track" cx="60" cy="60" r="59" /><circle class="pl-arc" cx="60" cy="60" r="59" pathLength="100" /></svg>
        <div class="pl-plate">
          <img data-src="/img/logo-full.webp" alt="" width="720" height="480" onload="this.classList.add('in')" onerror="this.remove()" />
        </div>
      </div>
    </div>
    <script>
      // Shows the preloader once per session; hides it on window load (min 0.9s so the logo can land, max 3.5s).
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        var seen = '1'
        try { seen = sessionStorage.getItem('bfa-preloaded'); sessionStorage.setItem('bfa-preloaded', '1') } catch (e) { /* storage blocked: skip */ }
        var p = document.getElementById('preloader')
        if (seen) return p.remove()
        d.classList.add('preloading')
        p.classList.add('on')
        var img = p.querySelector('img')
        img.src = img.getAttribute('data-src')
        var t0 = Date.now(), done = false
        var min = matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 900
        function finish() {
          if (done) return
          done = true
          setTimeout(function () {
            p.classList.add('pl-out')
            d.classList.remove('preloading')
            setTimeout(function () { p.remove() }, 700)
          }, Math.max(0, min - (Date.now() - t0)))
        }
        addEventListener('load', finish)
        setTimeout(finish, 3500)
      })()
    </script>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
